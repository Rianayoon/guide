<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관통사 물어보기 — 2026 필기</title>
<style>
:root{
  --bg:#f7f8fa; --card:#fff; --line:#e3e6ea; --tx:#1c1f23; --dim:#6b7280;
  --ac:#2563eb; --ac-bg:#eff4ff; --hl:#fff3a3;
  --guksa:#c2410c; --jawon:#047857; --beopgyu:#1d4ed8; --hakgaeron:#7c3aed;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.65; -webkit-text-size-adjust:100%;
}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 80px}

/* ── 헤더 ── */
header{position:sticky;top:0;z-index:20;background:rgba(247,248,250,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:12px 0 10px}
.hd{max-width:920px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.brand b{font-size:17px;letter-spacing:-.3px}
.brand span{font-size:12px;color:var(--dim)}
.brand .ver{margin-left:auto;font-weight:700;color:#0f766e;background:#ecfdf5;border:1px solid #6ee7b7;border-radius:999px;padding:2px 9px}
.sbox{display:flex;gap:8px;align-items:stretch}
#q{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 15px;border:1.5px solid var(--line);
  border-radius:12px;background:#fff;outline:none}
#q:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-bg)}
#go{flex:0 0 auto;font:inherit;font-size:16px;font-weight:600;padding:0 20px;border:0;border-radius:12px;
  background:var(--ac);color:#fff;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;
  background:#fff;color:var(--dim);cursor:pointer;white-space:nowrap}
.chip:active{background:var(--ac-bg)}
.subs{display:flex;gap:6px;overflow-x:auto;margin-top:9px;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sub{flex:0 0 auto;font-size:13.5px;font-weight:600;padding:6px 14px;border:1px solid var(--line);
  border-radius:999px;background:#fff;color:var(--dim);cursor:pointer;white-space:nowrap}
.sub.on{background:var(--tx);border-color:var(--tx);color:#fff}
.sub.cam{background:#0f766e;border-color:#0f766e;color:#fff}
#recent .chip{border-style:dashed}
.drop{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(15,118,110,.9);color:#fff;font-size:22px;font-weight:800}
.drop.on{display:flex}
.drop div{border:3px dashed #fff;border-radius:20px;padding:44px 60px}
.camst{background:#ecfdf5;border:1px solid #6ee7b7;border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:14px;color:#065f46}
.camst .bar{height:5px;background:#d1fae5;border-radius:3px;margin-top:7px;overflow:hidden}
.camst .bar i{display:block;height:100%;background:#0f766e;transition:width .2s}
.camh{font-size:15px;font-weight:800;margin-bottom:6px}
.camq{font-size:13px;color:var(--dim);background:#f3f5f7;border-radius:8px;padding:8px 11px;margin-bottom:14px;line-height:1.6}
#recent .chip b{font-weight:400;color:#9ca3af;margin-left:5px}

/* ── 탭 ── */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 8px;padding:8px 12px;background:#eef2f7;border-radius:10px;font-weight:800;font-size:15px;color:#1f3550}
.sec-h b{color:#dc2626}
.lfbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.lfl{font-size:13px;color:#64748b;font-weight:700;margin-right:2px}
.lfbar .chip{cursor:pointer}
.lfbar .chip.on{background:#0f766e;color:#fff;border-color:#0f766e}
.lfs{padding:6px 10px;border:1px solid #cbd5e1;border-radius:999px;font-size:14px;background:#fff}
.tabs{display:flex;gap:6px;margin:14px 0 12px}
.tab{flex:1;text-align:center;font-size:14px;font-weight:600;padding:10px 4px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--dim);cursor:pointer}
.tab.on{background:var(--tx);border-color:var(--tx);color:#fff}
.tab i{font-style:normal;font-weight:500;opacity:.65;font-size:12px;margin-left:3px}

/* ── 결과 카드 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:6px}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;line-height:1.5}
.b-국사{background:var(--guksa)} .b-자원{background:var(--jawon)}
.b-법규{background:var(--beopgyu)} .b-학개론{background:var(--hakgaeron)}
.b-기타{background:#6b7280}
.unit{font-size:13px;color:var(--dim)}
.h{font-size:16.5px;font-weight:700;letter-spacing:-.2px;margin:2px 0 7px}
.snip{font-size:14.5px;color:#374151;line-height:1.7}
.snip mark,mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.btn{font:inherit;font-size:13.5px;font-weight:600;padding:7px 14px;border:1px solid var(--line);
  border-radius:9px;background:#fff;color:var(--tx);cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--ac-bg);border-color:#c7d8ff;color:var(--ac)}
.btn.play{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:700}
.btn.scan{background:#1f2937;border-color:#1f2937;color:#fff;font-weight:700}
.ovl{position:fixed;inset:0;z-index:100;background:rgba(15,20,28,.92);display:flex;flex-direction:column}
.ovbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px 14px;background:#111827;color:#fff;font-size:15px}
.ovbar span{display:flex;gap:6px}
.btn.ovb{background:#374151;border-color:#4b5563;color:#fff;padding:6px 12px;font-size:13.5px}
.ovimg{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;text-align:center}
.ovimg img{max-width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.5)}
.full{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none}
.full.on{display:block}

/* ── 본문(마크다운) 렌더 ── */
.md{font-size:15px;line-height:1.75}
.md h3{font-size:15.5px;margin:16px 0 7px;padding-left:9px;border-left:3px solid var(--ac)}
.md h4{font-size:14.5px;margin:13px 0 5px;color:#374151}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0;padding-left:22px}
.md li{margin:3px 0}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.md blockquote{margin:10px 0;padding:9px 13px;background:#fffbea;border-left:3px solid #f0c14b;border-radius:0 8px 8px 0}
.md strong{font-weight:700}
.hitnav{position:sticky;top:104px;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--ac-bg);border:1px solid #c7d8ff;border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:13.5px;color:var(--ac)}
.hitnav b{font-variant-numeric:tabular-nums}
.btn.nb{padding:5px 11px;font-size:13px}
mark.hit{background:var(--hl)}
mark.hit.now{background:#ff9f43;color:#111;box-shadow:0 0 0 3px rgba(255,159,67,.3);border-radius:3px}
.warn{background:#fff8e1;border:1px solid #f0c14b;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px;color:#7a5b00}
pre.raw{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14.5px;line-height:1.75;margin:0;color:#374151}
.md code{background:#f1f3f5;padding:1px 5px;border-radius:4px;font-size:13.5px}
.tw{overflow-x:auto;margin:11px 0;border:1px solid var(--line);border-radius:10px}
.md table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
.md th,.md td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top;white-space:nowrap}
.md th{background:#f3f5f7;font-weight:700}
.md tr:nth-child(even) td{background:#fbfcfd}

/* ── 영상 결과 ── */
.tline{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.tstamp{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:#fff;background:var(--tx);
  padding:4px 11px;border-radius:8px;letter-spacing:.4px}
.tstamp.no{background:#9ca3af;font-size:12.5px;font-weight:600;letter-spacing:0}
.ctx{font-size:13.5px;color:#9ca3af;line-height:1.65;margin:4px 0}
.ctx.now{color:#374151;font-size:14.5px}
.lline{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:#9ca3af;line-height:1.6;padding:3px 0}
.lline.now{color:#1c1f23;font-size:15px;font-weight:500;background:#fffdf0;border-radius:8px;padding:7px 9px;margin:3px -9px}
.lt{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;color:#fff;background:#9ca3af;
  border-radius:6px;padding:2px 7px;text-decoration:none;white-space:nowrap}
a.lt{background:#dc2626}
.lline.now a.lt{background:#b91c1c}

/* ── 목록/기타 ── */
.sec-t{font-size:13px;font-weight:700;color:var(--dim);margin:18px 0 8px;letter-spacing:.3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
a.tile{display:block;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  text-decoration:none;color:var(--tx)}
a.tile .t1{font-size:14.5px;font-weight:700;margin-bottom:2px}
a.tile .t2{font-size:12.5px;color:var(--dim);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--dim);padding:44px 20px;font-size:15px;line-height:1.9}
.loading{text-align:center;color:var(--dim);padding:34px;font-size:14px}
.tab u{text-decoration:none}
@media(max-width:520px){ .md th,.md td{white-space:normal} .tab u{display:none} .tab{font-size:13.5px;padding:11px 2px} }
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><b>관통사 물어보기</b><span>2026 필기 · 내 자료 전용</span><span class="ver">v16</span></div>
    <div class="sbox">
      <input id="q" placeholder="예) 주심포 양식 특징" enterkeyhint="search" autocomplete="off">
      <button id="go">찾기</button>
    </div>
    <div class="subs" id="subs">
      <span class="sub on" data-s="">전체</span>
      <span class="sub" data-s="국사">국사</span>
      <span class="sub" data-s="자원">자원</span>
      <span class="sub" data-s="법규">법규</span>
      <span class="sub" data-s="학개론">학개론</span>
      <span class="sub cam" id="cam" title="사진 고르기 · ⌘V 붙여넣기 · 끌어다 놓기">📷 캡처로 찾기</span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="chips" id="recent"></div>
    <div style="margin-top:6px"><span class="chip" id="hardreload" style="color:#0f766e;border-color:#6ee7b7">🔄 최신으로 새로고침</span></div>
    <input type="file" id="camf" accept="image/*" style="display:none">
  </div>
</header>

<div class="wrap">
  <div class="tabs" id="tabs">
    <div class="tab on" data-t="all">🔎 한번에<u>&nbsp;보기</u><i id="ca"></i></div>
    <div class="tab" data-t="book">📕 학원교재<i id="cb"></i></div>
    <div class="tab" data-t="vid">🎬 강의<u>&nbsp;시점</u><i id="cv"></i></div>
    <div class="tab" data-t="page">📄 쪽수<u>&nbsp;찾기</u><i id="cp"></i></div>
    <div class="tab" data-t="unit">📖 내<u>&nbsp;자료</u><i id="cu"></i></div>
    <div class="tab" data-t="card">🗂 암기카드<i id="cc"></i></div>
    <div class="tab" data-t="link">🔗 링크<i id="cl"></i></div>
  </div>
  <div id="out"></div>
</div>

<script>
/* ══════════ 데이터 ══════════ */
var UNITS=null, LECS=null, LINKS=null, PAGES=null, BOOKS=null, CARDS=null, VIDS={}, SCANS={}, TAB='all', Q='';
var out=document.getElementById('out');

function load(u){ return fetch(u).then(function(r){return r.json()}); }
load('data/videos.json').then(function(v){ VIDS=v||{}; render(); }).catch(function(){});
load('data/scans.json').then(function(v){ SCANS=v||{}; if(Q) render(); }).catch(function(){});
Promise.all([load('data/books.json'), load('data/links.json'), load('data/pages.json')]).then(function(a){
  BOOKS=a[0]; LINKS=a[1]; PAGES=a[2]; render();
  load('data/lectures.json').then(function(l){ LECS=l; render(); });
  load('data/units.json').then(function(u){ UNITS=u; if(Q) render(); });
  load('data/cards.json').then(function(c){ CARDS=c; if(Q) render(); }).catch(function(){});
});

/* ══════════ 검색어 처리 ══════════ */
var STOP=['에 대해','에대해','에 대한','대해서','설명해줘','설명해','설명','알려줘','알려주','보여줘','보여',
          '뭐야','뭔가요','무엇','머야','해줘','해 줘','좀','만들어줘','만들어','정리해줘','정리해','정리',
          '표로','표','는','은','이','가','을','를','의','와','과','에','도','랑','및','что'];
function terms(q){
  var s=' '+q.trim()+' ';
  STOP.forEach(function(w){ if(w.length>1) s=s.split(w).join(' '); });
  var t=s.split(/[\s,./?!·「」"'()\[\]]+/).filter(function(w){ return w.length>=2; });
  // 조사 꼬리 제거 (2글자 이상 유지)
  t=t.map(function(w){ return w.replace(/(은|는|이|가|을|를|의|와|과|에|도|랑|이란|란|에서|부터|까지|처럼)$/,'')||w; })
     .filter(function(w){ return w.length>=2; });
  t=t.map(function(w){ return (w.length>=3 && /표$/.test(w)) ? w.slice(0,-1) : w; });
  var seen={},o=[]; t.forEach(function(w){ if(!seen[w]){seen[w]=1;o.push(w);} });
  o = o.length?o:[q.trim()].filter(Boolean);
  o.forEach(function(w,i){ o[i]=w; });
  o.ns = o.map(nsp);
  return o;
}
var PGWORD=/(\d{1,3})\s*(쪽|페이지|페)(?![0-9])/;
function searchPages(){
  var m=Q.match(PGWORD); if(!m||!PAGES) return [];
  var want=parseInt(m[1],10);
  var g=SUBJ?((SUBJ==='국사'||SUBJ==='자원')?'국사·자원':'법규·학개론') : (/국사|자원|한국사/.test(Q)?'국사·자원' : (/법규|개론|학개론|진흥법/.test(Q)?'법규·학개론':''));
  var k=/문제|기출|풀이/.test(Q)?'문제풀이' : (/핵심|이론|요약/.test(Q)?'핵심':'');
  return PAGES.filter(function(r){
    if(g && r.g.indexOf(g)!==0) return false;
    if(k && r.g.indexOf(k)<0) return false;
    return Math.abs(r.p-want)<=3;
  }).map(function(r){ return {r:r, d:Math.abs(r.p-want), want:want}; })
   .sort(function(a,b){ return a.d-b.d || a.r.t-b.r.t; }).slice(0,40);
}
var VIDWORD=/몇\s*시|몇\s*분|몇시|몇분|몇\s*번째|어디\s*(쯤|즈음|부분|서|에서|에\s*나|나와|나오|있|였|더라|말했|설명|얘기|나옴)|어느\s*(쯤|부분|즈음|대목)|타임|시점|시간대|대목|영상|동영상|강의\s*(어디|어느|언제)|언제\s*(나와|나오|했|나옴)|나와\?|나오나|나왔(어|나|지)/;

/* ══════════ 유틸 ══════════ */
function nsp(s){ return s.replace(/\s+/g,''); }
function nOf(o,k){ if(o['_n_'+k]===undefined) o['_n_'+k]=nsp(o[k]||''); return o['_n_'+k]; }
function looseRe(t){ return new RegExp(t.split('').map(reEsc).join('\\s*'),'g'); }
function countLoose(hayNoSpace, termNoSpace){
  if(!termNoSpace) return 0;
  var n=0, i=0;
  while((i=hayNoSpace.indexOf(termNoSpace,i))>=0){ n++; i+=termNoSpace.length; }
  return n;
}
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]}); }
function hl(s,ts){
  s=esc(s);
  ts.forEach(function(t){
    if(t.length<2) return;
    s=s.replace(new RegExp(nsp(t).split('').map(function(c){return c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('\\s*'),'g'),'\u0001$&\u0002');
  });
  return s.split('\u0001').join('<mark>').split('\u0002').join('</mark>');
}
function fmt(sec){
  if(sec<0) return '시간정보 없음';
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  var p=function(n){return n<10?'0'+n:''+n};
  return (h?h+':'+p(m):m+'')+':'+p(s);
}
function reEsc(t){ return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function markInEl(el, ts){
  if(!ts||!ts.length) return 0;
  var re=new RegExp('('+ts.map(function(t){ return nsp(t).split('').map(reEsc).join('\\s*'); }).join('|')+')','g');
  var w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false), nodes=[], n;
  while((n=w.nextNode())){ re.lastIndex=0; if(n.nodeValue && re.test(n.nodeValue)) nodes.push(n); }
  var count=0;
  nodes.forEach(function(node){
    var frag=document.createDocumentFragment(), last=0, s=node.nodeValue, m; re.lastIndex=0;
    while((m=re.exec(s))){
      if(m.index>last) frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      var mk=document.createElement('mark'); mk.className='hit'; mk.textContent=m[0];
      frag.appendChild(mk); last=m.index+m[0].length; count++;
      if(m[0].length===0) re.lastIndex++;
    }
    if(last<s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
  return count;
}
function jumpTo(box, idx, quiet){
  var hits=box.querySelectorAll('mark.hit');
  if(!hits.length) return;
  idx=(idx+hits.length)%hits.length;
  box._i=idx;
  hits.forEach(function(h){ h.classList.remove('now'); });
  hits[idx].classList.add('now');
  if(!quiet) hits[idx].scrollIntoView({block:'center', behavior:'smooth'});
  var lbl=box.querySelector('.hitnav b'); if(lbl) lbl.textContent=(idx+1)+' / '+hits.length;
}
var AUTOKEY='';
function autoOpen(sel, pfx, label){
  var key=Q+'|'+TAB+'|'+SUBJ;
  if(AUTOKEY===key) return;
  AUTOKEY=key;
  var btn=out.querySelector(sel);
  if(!btn) return;
  var id=pfx+(btn.dataset.x||btn.dataset.bx||btn.dataset.cx);
  var box=document.getElementById(id);
  if(box && !box.classList.contains('on')) openBox(btn, box, label, true);
}
function openBox(btn, box, closedLabel, quiet){
  var on=box.classList.toggle('on');
  btn.textContent = on ? '접기 ▴' : closedLabel;
  if(!on) return;
  if(!box.dataset.marked){

function md(src){
  var L=src.split('\n'), o=[], i=0;
  function flush(tag){ if(tag) o.push('</'+tag+'>'); }
  while(i<L.length){
    var ln=L[i];
    // 표
    if(/^\s*\|/.test(ln) && i+1<L.length && /^\s*\|[\s:|-]+\|?\s*$/.test(L[i+1])){
      var rows=[]; 
      while(i<L.length && /^\s*\|/.test(L[i])){ rows.push(L[i]); i++; }
      var cells=function(r){ return r.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim()}); };
      var head=cells(rows[0]);
      var body=rows.slice(2).map(cells);
      var h='<div class="tw"><table><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>'}).join('')+'</tr></thead><tbody>';
      body.forEach(function(r){ h+='<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>'}).join('')+'</tr>'; });
      o.push(h+'</tbody></table></div>'); continue;
    }
    if(/^\s*(---|===|\*\*\*)\s*$/.test(ln)){ o.push('<hr>'); i++; continue; }
    var m;
    if((m=ln.match(/^####\s+(.*)/))){ o.push('<h4>'+inline(m[1])+'</h4>'); i++; continue; }
    if((m=ln.match(/^###\s+(.*)/))){ o.push('<h3>'+inline(m[1])+'</h3>'); i++; continue; }
    if((m=ln.match(/^##?\s+(.*)/))){ o.push('<h3>'+inline(m[1])+'</h3>'); i++; continue; }
    if(/^\s*>\s?/.test(ln)){
      var q=[]; while(i<L.length && /^\s*>\s?/.test(L[i])){ q.push(L[i].replace(/^\s*>\s?/,'')); i++; }
      o.push('<blockquote>'+q.map(inline).join('<br>')+'</blockquote>'); continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(ln)){
      var ord=/^\s*\d+\./.test(ln), items=[];
      while(i<L.length && /^\s*([-*+]|\d+\.)\s+/.test(L[i])){
        items.push(L[i].replace(/^\s*([-*+]|\d+\.)\s+/,'')); i++;
      }
      o.push('<'+(ord?'ol':'ul')+'>'+items.map(function(t){return '<li>'+inline(t)+'</li>'}).join('')+'</'+(ord?'ol':'ul')+'>');
      continue;
    }
    if(!ln.trim()){ i++; continue; }
    var par=[]; while(i<L.length && L[i].trim() && !/^\s*[|>#]|^\s*([-*+]|\d+\.)\s+|^\s*(---)/.test(L[i])){ par.push(L[i]); i++; }
    if(!par.length){ par.push(L[i]); i++; }   // 무한루프 방지
    o.push('<p>'+par.map(inline).join('<br>')+'</p>');
  }
  return o.join('');
}

function proximity(hay, tns){

  var posList=tns.map(function(t){
    var arr=[], i=0, c=0;

  posList[0].forEach(function(p0){
    var lo=p0, hi=p0+tns[0].length;

      var n=countLoose(d.hayx!==undefined?d.hayx:d.hay, t);

    });

var qi=document.getElementById('q');
function go(push){
  Q=qi.value.trim();
  recentAdd(Q);
  if(!Q){ setTab('book'); }
  else if(PGWORD.test(Q)){ setTab('page'); }
  else {
    compute();
    var order = /카드|암기/.test(Q) ? ['card','book','unit','vid'] : (VIDWORD.test(Q) ? ['vid','book','unit','card'] : (TBLWORD.test(Q) ? ['unit','card','book','vid'] : ['book','unit','card','vid']));
    var pick = order.filter(function(k){ return FULL[k]>0; })[0] || order[0];
    setTab(pick);
  }
  render(); window.scrollTo(0,0);
  if(push!==false) pushState();
}
function pushState(){
  var st={q:Q,tab:TAB,subj:SUBJ};
  if(history.state && history.state.q===Q && history.state.tab===TAB && history.state.subj===SUBJ) return;
  history.pushState(st, '', '#'+encodeURIComponent(Q||'')+(TAB?'/'+TAB:'')+(SUBJ?'/'+SUBJ:''));
}
window.addEventListener('popstate', function(ev){
  var ov=document.querySelector('.ovl');
  if(ov){ ov.remove(); document.body.style.overflow=''; return; }
  var st=ev.state||{q:'',tab:'all',subj:''};
  Q=st.q||''; SUBJ=st.subj||''; qi.value=Q;
  document.querySelectorAll('.sub').forEach(function(x){ if(x.id!=='cam') x.classList.toggle('on', (x.dataset.s||'')===SUBJ); });
  setTab(st.tab||'all'); render(); window.scrollTo(0,0);
});
function setTab(t){
  TAB=t;
  document.querySelectorAll('.tab').forEach(function(e){ e.classList.toggle('on', e.dataset.t===t); });
}
document.getElementById('go').onclick=go;
qi.addEventListener('keydown',function(e){ if(e.key==='Enter'){ qi.blur(); go(); } });
document.getElementById('subs').onclick=function(e){
  var t=e.target.closest('.sub'); if(!t || t.id==='cam') return;
  SUBJ=t.dataset.s||'';

  if(Q) go(); else render();
};

/* ══════ 📷 캡처로 찾기 ══════ */
var TESS=null;
function camStatus(msg, pct){
  var el=document.getElementById('camst');
  if(!el){ el=document.createElement('div'); el.id='camst'; el.className='camst';
    document.querySelector('.wrap').insertBefore(el, out); }
  el.innerHTML='📷 '+esc(msg)+(pct!=null?' <b>'+Math.round(pct*100)+'%</b>':'')
    +'<div class="bar"><i style="width:'+Math.round((pct||0)*100)+'%"></i></div>';
}
function camDone(){ var el=document.getElementById('camst'); if(el) el.remove(); }
function loadScript(src){
  return new Promise(function(res,rej){
    var sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=rej;
    document.head.appendChild(sc);
  });
}
async function camRun(file){
  try{
    camStatus('글자 읽을 준비 중… (처음 한 번만 10초쯤)', 0.05);
    if(!window.Tesseract) await loadScript('ocr/tesseract.min.js');
    if(!TESS){
      TESS = await Tesseract.createWorker('kor', 1, {
        workerPath:'ocr/worker.min.js',
        corePath:'ocr/',
        langPath:'ocr/',
        logger:function(m){ if(m.status==='recognizing text') camStatus('글자 읽는 중…', m.progress); }
      });
    }
    camStatus('글자 읽는 중…', 0.1);
    var r = await TESS.recognize(file);
    var txt=(r.data.text||'').replace(/\s+/g,' ').trim();
    camDone();
    if(txt.length<6){ alert('글자를 못 읽었어요. 더 크게 잘라서 다시 찍어보세요.'); return; }
    camSearch(txt);
  }catch(e){ camDone(); alert('캡처 읽기에 실패했습니다: '+e.message); }
}
/* 읽어낸 글에서 특징적인 낱말을 뽑아 어느 자료·쪽·강의인지 찾는다 */
function camSearch(txt){
  var words=txt.split(/[^가-힣A-Za-z0-9]+/).filter(function(w){ return w.length>=2 && /[가-힣]/.test(w); });
  var freq={}; words.forEach(function(w){ freq[w]=(freq[w]||0)+1; });
  var uniq=Object.keys(freq);
  function scoreAll(items, getText){
    return items.map(function(it){
      var t=getText(it), n=0;
      uniq.forEach(function(w){ if(t.indexOf(w)>=0) n+=Math.min(freq[w],3); });
      return {it:it, n:n};
    }).filter(function(x){return x.n>0}).sort(function(a,b){return b.n-a.n});
  }
  var bk = BOOKS? scoreAll(BOOKS, function(b){return b.t}).slice(0,5) : [];
  var un = UNITS? scoreAll(UNITS, function(u){return u.title+' '+u.secs.map(function(s){return s.t}).join(' ')}).slice(0,3) : [];
  var lc = [];
  if(LECS){
    var per={};
    LECS.forEach(function(l){
      l.tx.forEach(function(t,i){
        var n=0; uniq.forEach(function(w){ if(t.indexOf(w)>=0) n+=Math.min(freq[w],3); });
        if(n>0){ var k=l.name; if(!per[k]||per[k].n<n) per[k]={n:n, l:l, i:i}; if(per[k]) per[k].tot=(per[k].tot||0)+n; }
      });
    });
    lc=Object.keys(per).map(function(k){return per[k]}).sort(function(a,b){return b.tot-a.tot}).slice(0,3);
  }
  var h='<div class="camres"><div class="camh">📷 캡처에서 읽은 내용으로 찾은 결과</div>';
  h+='<div class="camq">'+esc(txt.slice(0,110))+(txt.length>110?' …':'')+'</div>';
  if(bk.length){
    h+='<div class="sec-t">📕 학원교재 — 이 내용이 있는 쪽</div>';
    bk.forEach(function(x,i){
      var b=x.it;
      h+='<div class="card"><div class="meta"><span class="badge b-'+b.s+'">'+b.s+'</span>'
       +'<span class="unit">'+esc(b.b)+' · <b>'+b.p+'쪽</b>'+(i===0?' &nbsp;← 가장 유력':'')+'</span></div>'
       +'<div class="snip">'+esc(b.t.slice(0,150))+' …</div>'
       +'<div class="acts">'+scanBtn(b.b,b.p)+'<button class="btn p" data-goq="'+esc(b.b)+' '+b.p+'쪽">이 쪽 자세히 ▾</button></div></div>';
    });
  }
  if(un.length){
    h+='<div class="sec-t">📖 내 자료 — 관련 단원</div>';
    un.forEach(function(x){ var u=x.it;
      var url=unitLink(u);
      h+='<div class="card"><div class="meta"><span class="badge b-'+u.s+'">'+u.s+'</span>'
       +'<span class="unit">'+esc(u.label)+' · '+esc(u.title)+'</span></div>'
       +(url?'<div class="acts"><a class="btn" href="'+url+'" target="_blank" rel="noopener">단원 페이지 열기 ↗</a></div>':'')
       +'</div>';
    });
  }
  if(lc.length){
    h+='<div class="sec-t">🎬 이 내용을 공부할 때 들으면 좋은 강의</div>';
    lc.forEach(function(x,i){
      var l=x.l, sec=l.ts[x.i];
      h+='<div class="card"><div class="meta"><span class="badge b-'+(l.pair.indexOf("국사")>=0?"국사":"법규")+'">'+esc(l.kind)+'</span>'
       +'<span class="unit">'+esc(l.name)+(i===0?' &nbsp;← 가장 많이 다룸':'')+'</span></div>'
       +'<div class="tline"><span class="tstamp">'+fmt(sec)+'</span><span class="unit">여기부터 이 내용이 나옵니다</span></div>'
       +'<div class="ctx now">'+esc(l.tx[x.i])+'</div>'
       +(ytBtn(l.name,sec)?'<div class="acts">'+ytBtn(l.name,sec)+'</div>':'')+'</div>';
    });
  }
  if(!bk.length && !un.length && !lc.length) h+='<div class="empty">비슷한 내용을 못 찾았어요.</div>';
  h+='</div>';
  out.innerHTML=h; window.scrollTo(0,0);
}

/* 끌어다 놓기 */
(function(){
  var z=document.createElement('div'); z.className='drop'; z.innerHTML='<div>📷 여기에 놓으면 찾아드립니다</div>';
  document.body.appendChild(z);
  var cnt=0;
  window.addEventListener('dragenter', function(e){ e.preventDefault(); cnt++; z.classList.add('on'); });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('dragleave', function(e){ if(--cnt<=0){ cnt=0; z.classList.remove('on'); } });
  window.addEventListener('drop', function(e){
    e.preventDefault(); cnt=0; z.classList.remove('on');
    var f=(e.dataTransfer.files||[])[0];
    if(f && f.type.indexOf('image')===0) camRun(f);
    else if(f) alert('이미지 파일만 됩니다.');
  });
})();

window.addEventListener('paste', function(e){
  var it=(e.clipboardData||{}).items||[];
  for(var i=0;i<it.length;i++) if(it[i].type.indexOf('image')===0){ camRun(it[i].getAsFile()); break; }
});
