<script>(function(){
var GN={view:"한눈에 비교",kings:"왕 계보",order:"사건 순서",sys:"제도·통치체제",relic:"유물·불교",trap:"O/X"};
var GO=["view","kings"];
function ic(n){return '<svg class="ic"><use href="#i-'+n+'"/></svg>';}
function mk(s){return String(s).replace(/«([^»]*)»/g,'<span class="m">$1</span>');}
var o=[],i,j,s,r;


for(i=0;i<D.length;i++){s=D[i];
 o.push('<section class="blk" data-g="'+s.g+'">');
 o.push('<div class="bh"><h3>'+(i+1)+'. '+s.t+'</h3><span class="bt">'+GN[s.g]+'</span></div>');
 if(s.type==="tl"){
  var LC=['h1c','h2c','h3c'];
  o.push('<div class="tl"><div class="tlrule"><div></div>');
  for(j=0;j<s.lanes.length;j++)o.push('<div class="tlhd '+LC[j]+'"><span class="nm">'+s.lanes[j][0]+'</span><span class="rule">'+s.lanes[j][1]+'</span>'+(s.lanes[j][2]?'<span class="peak">'+ic('crown')+' '+s.lanes[j][2]+'</span>':'')+'</div>');
  o.push('</div>');
  var BL={t:'전성기',f:'체제정비',e:'멸망',b:'나라를 세움',u:'삼국통일'};
  for(j=0;j<s.rows.length;j++){var R=s.rows[j];
   o.push('<div class="tlrow"><div class="tlage">'+R[0]+'<span>'+R[1]+'</span></div>');
   for(var L=0;L<3;L++){var KS=R[2+L];
    if(!KS.length){o.push('<div class="tlc e">해당 없음</div>');continue;}
    o.push('<div class="tlc">');
    for(var x=0;x<KS.length;x++){var K=KS[x];
     o.push('<div class="kg'+(K[2]?' '+({t:'top',f:'fix',e:'end',b:'b',n:'end',u:'uni'})[K[2]]:'')+'"><div class="kn">'+(K[2]==='t'||K[2]==='u'?ic('crown'):'')+K[0]
      +(K[2]&&BL[K[2]]?' <span class="bd '+K[2]+'">'+BL[K[2]]+'</span>':'')+'</div><div class="kd">'+mk(K[1])+'</div></div>');}
    o.push('</div>');}
   o.push('</div>');
   var HW=s.han[j][1];
   o.push('<div class="han"><div class="hanlb">한강 주인</div>');
   for(L=0;L<3;L++)o.push('<div class="hancell'+(HW===L?' on':'')+'">'+(HW===L?'이 나라가 한강을 가짐 = 최강':(HW<0?'—':''))+'</div>');
   o.push('</div>');
  }
  o.push('</div>');
 } else if(s.type==="pairs"){
  o.push('<div class="pairs">');
  for(j=0;j<s.pairs.length;j++){r=s.pairs[j];
   o.push('<article class="pair"><div class="pr">'
    +'<div class="pc pcL"><span class="pt">'+r[0]+'</span><span class="pd">'+mk(r[1])+'</span></div>'
    +'<div class="pvs">VS</div>'
    +'<div class="pc pcR"><span class="pt">'+r[2]+'</span><span class="pd">'+mk(r[3])+'</span></div></div>'
    +'<div class="pw">'+ic('spark')+'<span>'+r[4]+'</span></div></article>');}
  o.push('</div>');
 } else if(s.type==="traps"){
  o.push('<div class="tw traps" style="padding:14px 16px"><ul>');
  for(j=0;j<s.items.length;j++)o.push('<li>'+s.items[j]+'</li>');
  o.push('</ul></div>');
 } else {
  o.push('<div class="tw"><table><thead><tr>');
  for(j=0;j<s.cols.length;j++)o.push('<th>'+s.cols[j]+'</th>');
  o.push('</tr></thead><tbody>');
  for(j=0;j<s.rows.length;j++){r=s.rows[j];
   var PK=/전성기/.test(String(r[0]));
   o.push('<tr'+(PK?' class="hi"':'')+'>');
   for(var k=0;k<s.cols.length;k++){
    var v=r[k]===undefined?'':r[k],cl=[];
    if(k===0){cl.push('era');if(PK)v='<svg class="ic cr"><use href="#i-crown"/></svg>'+v;}
    if(k===1&&(s.g==='kings'))cl.push('k');
    if(/^[SABC]$/.test(String(v)))v='<span class="g g'+v+'">'+v+'</span>';
    if(k===s.cols.length-1&&r.length>s.cols.length)v=v+'<span class="mz">'+r[s.cols.length]+'</span>';
    o.push('<td'+(cl.length?' class="'+cl.join(' ')+'"':'')+'>'+mk(v)+'</td>');}
   o.push('</tr>');}
  o.push('</tbody></table></div>');
 }
 o.push('</section>');
}
document.getElementById('main').innerHTML=o.join('');

var tb=['<button class="tab on" data-f="all">전체</button>'];
for(i=0;i<GO.length;i++)tb.push('<button class="tab" data-f="'+GO[i]+'">'+GN[GO[i]]+'</button>');
document.getElementById('tabs').innerHTML=tb.join('');
var secs=document.querySelectorAll('section.blk');
document.getElementById('tabs').addEventListener('click',function(e){
 var b=e.target.closest('.tab'); if(!b)return;
 var f=b.getAttribute('data-f'),t=document.querySelectorAll('.tab');
 for(i=0;i<t.length;i++)t[i].classList.toggle('on',t[i]===b);
 for(i=0;i<secs.length;i++)secs[i].style.display=(f==='all'||secs[i].getAttribute('data-g')===f)?'':'none';
 document.getElementById('q').value='';
 var rows=document.querySelectorAll('tbody tr');
 for(i=0;i<rows.length;i++)rows[i].style.display='';
 window.scrollTo({top:0,behavior:'smooth'});
});

document.getElementById('q').addEventListener('input',function(){
 var v=this.value.trim().toLowerCase();
 for(i=0;i<secs.length;i++){
  var hit=0,rows=secs[i].querySelectorAll('tbody tr'),pr=secs[i].querySelectorAll('.pair'),li=secs[i].querySelectorAll('.traps li');
  if(!v){
   for(j=0;j<rows.length;j++)rows[j].style.display='';
   for(j=0;j<pr.length;j++)pr[j].style.display='';
   for(j=0;j<li.length;j++)li[j].style.display='';
   secs[i].style.display=''; continue;}
  for(j=0;j<rows.length;j++){var h=rows[j].textContent.toLowerCase().indexOf(v)>=0;rows[j].style.display=h?'':'none';if(h)hit++;}
  for(j=0;j<pr.length;j++){var h2=pr[j].textContent.toLowerCase().indexOf(v)>=0;pr[j].style.display=h2?'':'none';if(h2)hit++;}
  for(j=0;j<li.length;j++){var h3=li[j].textContent.toLowerCase().indexOf(v)>=0;li[j].style.display=h3?'':'none';if(h3)hit++;}
  secs[i].style.display=hit?'':'none';}
});

var mb=document.getElementById('mask');
mb.addEventListener('click',function(){
 var on=document.body.classList.toggle('mk');
 mb.classList.toggle('on',on);
 var m=document.querySelectorAll('.m');
 for(i=0;i<m.length;i++)m[i].classList.remove('op');
});
document.getElementById('main').addEventListener('click',function(e){
 if(!document.body.classList.contains('mk'))return;
 var t=e.target.closest('.m'); if(t)t.classList.toggle('op');
});
var db=document.getElementById('dark');
db.addEventListener('click',function(){
 var d=document.documentElement.getAttribute('data-t')==='d';
 document.documentElement.setAttribute('data-t',d?'l':'d');
 db.classList.toggle('on',!d);
});
document.getElementById('pr').addEventListener('click',function(){window.print();});
})();</script>
